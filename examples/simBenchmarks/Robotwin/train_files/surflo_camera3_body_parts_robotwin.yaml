# Effective batch 8 on one GPU; 2500 updates process 20000 training samples.
run_id: surflo_camera3_body_parts_robotwin_rotate_qrcode_20ksamples
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null
wandb_project: surflo-dit-robotwin
is_debug: false
version_id: '0.21'
framework:
  name: SurfloDiT
  surflo:
    source_root: /export/home/haoliang/projects/Surflo
    checkpoint_path: /export/home/haoliang/projects/Surflo/checkpoints/surflo_v0.pt
    model_config_path: /export/home/haoliang/projects/Surflo/configs/model/surflo.yaml
    use_ema: true
    freeze_backbone: true
    image_size: 518
    num_views: 3
    append_camera_token: true
    append_per_view_camera_tokens: true
  action_model:
    action_model_type: DiT-L
    action_dim: 14
    action_hidden_dim: 1024
    action_horizon: 16
    state_dim: 14
    num_condition_tokens: 136
  state_scale: 1.0
  state_dropout_prob: 0.2
  state_conditioning: parts
  state_parts_layout: robotwin
  visual_adapter_type: linear
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /export/home/haoliang/projects/starVLA/playground/Datasets/RoboTwin
    data_mix: robotwin_surflo_rotate_qrcode
    lerobot_version: v2.0
    action_mode: abs
    include_state: true
    per_device_batch_size: 4
    num_workers: 4
    persistent_workers: false
    load_all_data_for_training: false
    obs_image_size:
    - 518
    - 518
    video_backend: torchvision_av
    action_type: abs_qpos
    validation_fraction: 0.1
    validation_seed: 42
    drop_last: true
trainer:
  save_training_state: true
  max_train_steps: 2500
  num_warmup_steps: 100
  save_interval: 500
  eval_interval: 250
  learning_rate:
    base: 0.0003
    visual_proj: 0.0003
    state_proj: 0.0003
    action_model: 0.0003
    visual_adapter: 0.0003
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
  freeze_modules: surflo_backbone
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  sample_budget: 20000
  validation_ddim_steps: 20
  validation_max_batches: 32
evaluation:
  execute_horizon: 8
  num_ddim_steps: 20
