run_id: vggt_omega_oft
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: josefshang
wandb_project: vggt-omega-action-pred
is_debug: false
version_id: "0.21"

framework:
  name: VGGTOmegaOFT

  vggt_omega:
    # VGGT-Omega-1B-256 with text alignment checkpoint
    checkpoint_path: /export/home/haoliang/projects/vggt-omega-action-pred/ckpt/vggt_omega_1b_256_text.pt
    freeze_backbone: true

  clip_text:
    model_name: openai/clip-vit-base-patch32
    freeze: true

  action_model:
    action_model_type: MLP
    action_dim: 14
    action_hidden_dim: 1024
    action_horizon: 16
    state_dim: 14

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_task1
    action_type: abs_qpos
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  max_train_steps: 50000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-04
    visual_pool: 1.0e-04
    visual_proj: 1.0e-04
    text_proj: 1.0e-04
    state_proj: 1.0e-04
    temporal_embed: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: 'vggt_omega,clip_text_model'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
