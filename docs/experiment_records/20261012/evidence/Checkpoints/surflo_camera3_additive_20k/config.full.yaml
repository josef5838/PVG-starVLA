run_id: surflo_camera3_additive_20k
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: null
wandb_project: surflo-dit-behavior2026
is_debug: false
version_id: '0.21'
framework:
  name: SurfloDiT
  surflo:
    source_root: /export/home/haoliang/projects/Surflo
    checkpoint_path: /export/home/haoliang/projects/Surflo/checkpoints/surflo_v0.pt
    model_config_path: /export/home/haoliang/projects/Surflo/configs/model/surflo.yaml
    use_ema: true
    freeze_backbone: true
    image_size: 518
    num_views: 3
    append_camera_token: true
    append_per_view_camera_tokens: true
  action_model:
    action_model_type: DiT-L
    action_dim: 23
    action_hidden_dim: 1024
    action_horizon: 16
    state_dim: 61
    num_condition_tokens: 132
    future_action_window_size: 15
    past_action_window_size: 0
  state_scale: 1.0
  state_dropout_prob: 0.2
  state_conditioning: add
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /export/home/haoliang/projects/starVLA/playground/Datasets
    data_mix: behavior_1k_2026_turn_on_radio
    lerobot_version: v3.0
    action_mode: abs
    include_state: true
    per_device_batch_size: 1
    num_workers: 4
    load_all_data_for_training: true
    obs_image_size:
    - 518
    - 518
    video_backend: torchvision_av
trainer:
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 0.0003
    visual_proj: 0.0003
    state_proj: 0.0003
    action_model: 0.0003
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
  freeze_modules: surflo_backbone
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
config_yaml: examples/simBenchmarks/Behavior/train_files/surflo_dit_turn_on_radio_2026.yaml
output_dir: results/Checkpoints/surflo_camera3_additive_20k
