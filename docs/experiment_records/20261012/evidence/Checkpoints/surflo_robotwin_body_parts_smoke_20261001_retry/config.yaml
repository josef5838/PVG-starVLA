datasets:
  vla_data:
    action_mode: abs
    data_mix: robotwin_surflo_rotate_qrcode
    data_root_dir: /export/home/haoliang/projects/starVLA/playground/Datasets/RoboTwin
    dataset_py: lerobot_datasets
    include_state: true
    lerobot_version: v2.0
    num_workers: 0
    obs_image_size:
    - 518
    - 518
    per_device_batch_size: 1
    video_backend: torchvision_av
framework:
  action_model:
    action_dim: 14
    action_hidden_dim: 1024
    action_horizon: 16
    action_model_type: DiT-L
    num_condition_tokens: 136
    state_dim: 14
  name: SurfloDiT
  state_conditioning: parts
  state_dropout_prob: 0.2
  state_parts_layout: robotwin
  state_scale: 1.0
  surflo:
    append_camera_token: true
    append_per_view_camera_tokens: true
    checkpoint_path: /export/home/haoliang/projects/Surflo/checkpoints/surflo_v0.pt
    freeze_backbone: true
    image_size: 518
    model_config_path: /export/home/haoliang/projects/Surflo/configs/model/surflo.yaml
    num_views: 3
    source_root: /export/home/haoliang/projects/Surflo
    use_ema: true
    weights_mode: reference
output_dir: results/Checkpoints/surflo_robotwin_body_parts_smoke_20261001_retry
run_id: surflo_robotwin_body_parts_smoke_20261001_retry
run_root_dir: results/Checkpoints
seed: 42
trainer:
  eval_interval: 2
  freeze_modules: surflo_backbone
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0003
    base: 0.0003
    state_proj: 0.0003
    visual_proj: 0.0003
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 2
  num_warmup_steps: 0
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 2
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
