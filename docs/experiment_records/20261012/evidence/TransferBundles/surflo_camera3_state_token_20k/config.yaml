datasets:
  vla_data:
    action_mode: abs
    data_mix: behavior_1k_2026_turn_on_radio
    data_root_dir: /export/home/haoliang/projects/starVLA/playground/Datasets
    dataset_py: lerobot_datasets
    lerobot_version: v3.0
    num_workers: 4
    per_device_batch_size: 1
    video_backend: torchvision_av
framework:
  action_model:
    action_dim: 23
    action_hidden_dim: 1024
    action_horizon: 16
    action_model_type: DiT-L
    num_condition_tokens: 133
    state_dim: 61
  name: SurfloDiT
  state_conditioning: token
  state_dropout_prob: 0.2
  state_scale: 1.0
  surflo:
    append_camera_token: true
    append_per_view_camera_tokens: true
    checkpoint_path: SET_VIA_BUNDLE_LOADER
    freeze_backbone: true
    image_size: 518
    model_config_path: SET_VIA_BUNDLE_LOADER
    num_views: 3
    source_root: SET_VIA_BUNDLE_LOADER
    use_ema: true
    weights_mode: reference
output_dir: results/Checkpoints/surflo_camera3_state_token_20k
run_id: surflo_camera3_state_token_20k
run_root_dir: results/Checkpoints
seed: 42
trainer:
  eval_interval: 1000
  freeze_modules: surflo_backbone
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0003
    base: 0.0003
    state_proj: 0.0003
    visual_proj: 0.0003
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 20000
  num_warmup_steps: 500
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 10000
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
wandb_entity: null
wandb_project: surflo-dit-behavior2026
